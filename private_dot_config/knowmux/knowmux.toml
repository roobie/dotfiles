# SEE: urn:unique_reference:knowmux::readme
[[sources]]
path = "~/.local/share/knowmux/sources/systemd"
adapter = "markdown"
include = [".*\\.md$"]
exclude = []

[adapter.systemd]
include = [
  "knowmux-*",
  "restic-*",
  "backup-*",
  "nanovault-*",
  "catena*",
  "deltatrials.slice",
  "notification-*.timer",   # ephemeral notification-<ts>.* still filtered by D-10 rule 3
]
freshness_slack = "1h"      # added to materializer cadence for valid_until (D-14)
